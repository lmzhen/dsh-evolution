# Evolution agent layer — DELTA ONLY.
#
# This is the legacy delta of the Evolution preset. 0.48 removed the installer
# composition path that consumed it; the file stays only so an existing 0.47
# profile's preset row remains readable and uninstallable. No new profile is
# generated from it.
# Historical note: the standard rows came from the dsh being installed
# against, so the preset followed whatever platform version the user actually
# had — rc, release, or any future line — instead of vendoring one baseline's
# rows forever.
#
# The host bundle provides memory/skill services; this preset only exposes
# the model-facing entry points and the native skill-catalog bridge.
#
# This delta deliberately keeps the MINIMAL model-facing set and does NOT
# duplicate host-bundle rows: `evolution-maintenance/tools` (maintenance_probe)
# is evolution-host-owned, so repeating it here would mount the row twice in a
# layered install. The platform owns the session-query index policy; the family
# does not override it. The
# `tool-skill` 60-char catalog cap is likewise NOT carried as a delta row: the
# session-visible `tool-skill` instance is the standard composition's own row,
# so a delta copy would collide with it (N-5) and a profile-root patch cannot
# reach this preset scope at all — instead the preset COMPOSER (both
# `/evolution preset install` and install-layered; 0.3.53 unified the rule)
# INJECTS the cap onto that standard-sourced row at generation time (V10-14).
# The delta rows are also the only evolution-owned text in the composed
# preset, so it tracks every platform version.
- id: tool-memory
  name: '@deepseek-ai/dsh-memory/tools'

- id: tool-skill-manage
  name: '@deepseek-ai/dsh-tool-skill-manage'

# Cross-session recall. The memory guidance tells the model to use
# `session_search` instead of saving task progress, so the tool must be
# mounted for that guidance to be actionable. The backing index follows the
# platform policy (opt-in); enable it in a profile patch if content search is
# wanted.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

- id: evolution-skill-catalog
  name: '@deepseek-ai/dsh-evolution-skill-discovery/catalog'

# Program B discovery: skill_search lives in the preset scope so the model-facing
# tool registry and its executor are the same scope.
- id: evolution-skill-discovery
  name: '@deepseek-ai/dsh-evolution-skill-discovery'
  config:
    mode: off
    featureEpoch: v0
