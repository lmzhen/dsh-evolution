# Evolution agent layer — DELTA ONLY.
#
# This file is the incremental part of the Evolution preset, NOT a full
# composition. `install-layered.mjs` (agent/layered modes; V6-52, 0.3.37 —
# oneclick installs the preset BUNDLE row instead of writing this file)
# generates the installed preset at
# `$DSH_HOME/.agent-presets/evolution/agent.cordis.yml`
# by concatenating the RUNTIME platform's `standard` preset composition with
# this delta (rc.53): the standard rows come from the dsh being installed
# against, so the preset follows whatever platform version the user actually
# has — rc, release, or any future line — instead of vendoring one baseline's
# rows forever.
#
# The host bundle provides memory/skill services; this preset only exposes
# the model-facing entry points and the native skill-catalog bridge.
#
# This delta deliberately keeps the MINIMAL model-facing set and does NOT
# duplicate host-bundle rows: `evolution-maintenance/tools` (maintenance_probe)
# and the `session-query-sqlite` index override are evolution-host-owned, so
# repeating them here would mount the row twice in a layered install. The
# `tool-skill` 60-char catalog cap is likewise NOT carried as a delta row: the
# session-visible `tool-skill` instance is the standard composition's own row,
# so a delta copy would collide with it (N-5) and a profile-root patch cannot
# reach this preset scope at all — instead install-layered INJECTS the cap onto
# that standard-sourced row at generation time (V10-14). The delta rows are
# also the only evolution-owned text in the composed preset, so it tracks
# every platform version.
- id: tool-memory
  name: '@deepseek-ai/dsh-tool-memory'

- id: tool-skill-manage
  name: '@deepseek-ai/dsh-tool-skill-manage'

# Cross-session recall. The memory guidance tells the model to use
# `session_search` instead of saving task progress, so the tool must be
# mounted for that guidance to be actionable. The backing index is enabled
# by evolution-host's `session-query-sqlite` row (see its openAt/path config).
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

- id: evolution-skill-catalog
  name: '@deepseek-ai/dsh-evolution-skill-catalog'
