# Recommended native dsh-evolution composition (bundle patch form).
#
# This file is a DSH bundle PATCH: it inserts the evolution rows into the
# profile's empty root composition and therefore uses the loader's
# `- insert:` patch vocabulary, not the top-level entry list of cordis.yml.
#
# The storage stack (`storage`, `storage-json`, `storage-domain`) is
# HOST-plane in DSH, exactly like session persistence and the native approval
# stack. A preset must not own it. `evolution-state-domain` below joins the
# host's storage-domain facility when present; `evolution-state-json` remains
# the portable fallback and audit provider.
- insert:
    # ── control plane ───────────────────────────────────────────────────────
    - id: evolution-policy
      name: '@deepseek-ai/dsh-evolution-policy'

    # ── IO seam: one registry, one node:fs provider ─────────────────────────
    - id: evolution-io
      name: '@deepseek-ai/dsh-evolution-io'
    - id: evolution-io-node
      name: '@deepseek-ai/dsh-evolution-io-node'

    # ── durable state: storage-domain KV first, portable JSON fallback ──────
    - id: evolution-state-storage
      name: '@deepseek-ai/dsh-evolution-state-storage'
    - id: evolution-state-domain
      name: '@deepseek-ai/dsh-evolution-state-domain'
      # The storage-domain provider is opt-in. It is disabled by default so a
      # profile without the host storage-domain facility boots deterministically
      # and evolution-state-json remains the active portable backend. Enable it
      # explicitly in a profile overlay only when storage-domain is mounted.
      disabled: true
    - id: evolution-state-json
      name: '@deepseek-ai/dsh-evolution-state-json'
    - id: evolution-state
      name: '@deepseek-ai/dsh-evolution-state'

    # ── memory: registry, provider, model-facing tool ───────────────────────
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: memory-files
      name: '@deepseek-ai/dsh-memory-files'
    - id: tool-memory
      name: '@deepseek-ai/dsh-tool-memory'

    # ── skills: usage telemetry, model-facing management tool ───────────────
    - id: skill-usage
      name: '@deepseek-ai/dsh-skill-usage'
    - id: tool-skill-manage
      name: '@deepseek-ai/dsh-tool-skill-manage'
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
    - id: evolution-skill-catalog
      name: '@deepseek-ai/dsh-evolution-skill-catalog'

    # ── write admission: staged approval (off by default) + threat guard ────
    - id: evolution-approval
      name: '@deepseek-ai/dsh-evolution-approval'
      config:
        enabled: false
        stageForeground: true
    - id: evolution-capability
      name: '@deepseek-ai/dsh-evolution-capability'
    - id: evolution-threat
      name: '@deepseek-ai/dsh-evolution-threat'

    # ── review / curator / observability / human controls ───────────────────
    - id: evolution-review
      name: '@deepseek-ai/dsh-evolution-review'
    - id: evolution-curator
      name: '@deepseek-ai/dsh-evolution-curator'
    - id: evolution-commands
      name: '@deepseek-ai/dsh-evolution-commands'
    - id: evolution-activity
      name: '@deepseek-ai/dsh-evolution-activity'
    - id: evolution-feedback
      name: '@deepseek-ai/dsh-evolution-feedback'
    - id: evolution-learning-graph
      name: '@deepseek-ai/dsh-evolution-learning-graph'
    - id: evolution-replay
      name: '@deepseek-ai/dsh-evolution-replay'

# ── cross-session recall: enable the native session-query index ─────────────
# Mirrors evolution-host: this is an OVERRIDE of the base `session-query-sqlite`
# row (never an insert) so it sits OUTSIDE the `- insert:` block. Parameterized
# via dsh `!!js` runtime env evaluation; profile overlays may still override.
- id: session-query-sqlite
  config:
    path: !!js (process.env.DSH_EVOLUTION_SESSION_QUERY_PATH ?? ((process.env.DSH_HOME ?? process.env.USERPROFILE ?? '.') + '/evolution/session-query.db'))
    openAt: !!js process.env.DSH_EVOLUTION_SESSION_QUERY ?? 'startup'
