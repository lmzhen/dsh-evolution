# Recommended composition for the native dsh-evolution family.
#
# Every medium dependency is behind a provider seam:
#   ctx.evolutionIo            -> node:fs provider (evolution-io-node)
#   ctx.evolutionStateStorage  -> storage-domain KV provider, with a JSON
#                                provider mounted as fallback/portable audit
#
# The legacy `@deepseek-ai/dsh-evolution` facade was retired at rc.18; this
# composition uses the smaller native packages instead.

# ── control plane (immutable policy, deterministic plan validation) ────────
- id: evolution-policy
  name: '@deepseek-ai/dsh-evolution-policy'

# ── IO seam: one registry, one node:fs provider ─────────────────────────────
- id: evolution-io
  name: '@deepseek-ai/dsh-evolution-io'
- id: evolution-io-node
  name: '@deepseek-ai/dsh-evolution-io-node'

# ── durable state: DSH storage-domain KV is the primary provider ────────────
- id: storage
  name: '@deepseek-ai/dsh-storage'
- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js dshHomePath('evolution', 'storage')
- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- id: evolution-state-storage
  name: '@deepseek-ai/dsh-evolution-state-storage'
- id: evolution-state-domain
  name: '@deepseek-ai/dsh-evolution-state-domain'
- id: evolution-state-json
  name: '@deepseek-ai/dsh-evolution-state-json'
- id: evolution-state
  name: '@deepseek-ai/dsh-evolution-state'

# ── memory: registry, provider, model-facing tool ───────────────────────────
- id: memory
  name: '@deepseek-ai/dsh-memory'
- id: memory-files
  name: '@deepseek-ai/dsh-memory-files'
- id: tool-memory
  name: '@deepseek-ai/dsh-tool-memory'

# ── skills: usage telemetry, model-facing management tool ───────────────────
- id: skill-usage
  name: '@deepseek-ai/dsh-skill-usage'
- id: tool-skill-manage
  name: '@deepseek-ai/dsh-tool-skill-manage'
- id: evolution-skill-catalog
  name: '@deepseek-ai/dsh-evolution-skill-catalog'

# ── write admission: staged approval (off by default) + threat guard ────────
- id: evolution-approval
  name: '@deepseek-ai/dsh-evolution-approval'
  config:
    enabled: false
    stageForeground: true
- id: evolution-capability
  name: '@deepseek-ai/dsh-evolution-capability'
- id: evolution-threat
  name: '@deepseek-ai/dsh-evolution-threat'

# ── review / curator / observability / human controls ───────────────────────
- id: evolution-review
  name: '@deepseek-ai/dsh-evolution-review'
- id: evolution-curator
  name: '@deepseek-ai/dsh-evolution-curator'
- id: evolution-commands
  name: '@deepseek-ai/dsh-evolution-commands'
- id: evolution-activity
  name: '@deepseek-ai/dsh-evolution-activity'
- id: evolution-feedback
  name: '@deepseek-ai/dsh-evolution-feedback'
- id: evolution-learning-graph
  name: '@deepseek-ai/dsh-evolution-learning-graph'
- id: evolution-replay
  name: '@deepseek-ai/dsh-evolution-replay'
