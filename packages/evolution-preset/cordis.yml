# Recommended composition for the native dsh-evolution family.
#
# Every medium dependency is behind a provider seam:
#   ctx.evolutionIo            -> node:fs provider (evolution-io-node)
#   ctx.evolutionStateStorage  -> domain KV provider as the PRIMARY medium
#                                (explicitly pinned on the `evolution-state`
#                                row below); the JSON provider is mounted too
#                                but is an explicitly selectable alternative
#                                only — a profile overlay re-pins
#                                `provider: json`. There is NO automatic
#                                fallback: registry `provider()` returns the
#                                first-registered provider when unpinned, so
#                                both rows are listed for resolution, not for
#                                failover.
#
# Row-set differences from the layered / one-click flows (G5.1 decision).
# This STANDALONE file is a hand-composed evolution row set, and it
# deliberately omits the rows the platform or the host bundle already
# provides, so it is NOT a faithful superset of the full composition:
#   - storage ownership (D-30): the storage stack (`storage`, `storage-json`,
#     `storage-domain`) is HOST-plane in DSH — a preset must not own it. This
#     STANDALONE composition lists it only because a hand-composed file has no
#     host bundle behind it; the overlay form (cordis.patch.yml) relies on the
#     host providing the facility and therefore does not list these rows. When
#     composing manually, include the host storage rows yourself (or use the
#     patch overlay on a host that already provides them).
#   - `tool-session-query` is carried by the agent/one-click delta (the layered
#     flow gets it from the Evolution agent preset), so it is not repeated
#     here; a fully self-sufficient manual compose should add it (plus the
#     host's `session-query-sqlite` index override) for cross-session recall.
#   - `evolution-maintenance-tools` is listed by the overlay form and the host
#     bundle but deliberately NOT by this STANDALONE file (H-01) — a standalone
#     compose that wants maintenance_probe / `/evolution maintain` must add the
#     row (`name: '@deepseek-ai/dsh-evolution-maintenance/tools'`) itself. The
#     package.json dependency on `dsh-evolution-maintenance` exists so that
#     added row resolves without also editing dependencies. The standalone file
#     likewise carries no `session-query-sqlite` override; the overlay form
#     carries it (overriding the platform row the DSH profile already has).
#   - the `tool-skill` 60-char catalog cap override is carried by the one-click
#     patch (V10-14) and by the host bundle as the identical root-level row;
#     this STANDALONE file does not list it — a manual compose wanting the cap
#     adds the override itself, and preset-scope sessions need the
#     install-layered injection (V10-14) regardless. `host` and the preset are
#     ALTERNATIVE install targets: never install both (either form), or shared
#     rows would mount twice (E-33).
#   - `evolution-capability` was retired in 0.3.66 (source removed): approval
#     that does not gate execution is only a log, and the dynamic-package
#     lifecycle belongs to the platform Creator mode.
#
# The legacy `@deepseek-ai/dsh-evolution` facade was retired from publishing
# after the v0.1.0-rc.18 release tag (see docs/codebase-audit-rc16.md); this
# composition uses the smaller native packages instead.

# ── control plane (immutable policy, deterministic plan validation) ────────
- id: evolution-policy
  name: '@deepseek-ai/dsh-evolution-policy'

# ── IO seam: one registry, one node:fs provider ─────────────────────────────
- id: evolution-io
  name: '@deepseek-ai/dsh-evolution-io'
- id: evolution-io-node
  name: '@deepseek-ai/dsh-evolution-io-node'

# ── durable state: DSH storage-domain KV is the primary provider ────────────
- id: storage
  name: '@deepseek-ai/dsh-storage'
- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js dshHomePath('evolution', 'storage')
- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- id: evolution-state-storage
  name: '@deepseek-ai/dsh-evolution-state-storage'
- id: evolution-state-domain
  name: '@deepseek-ai/dsh-evolution-state-domain'
- id: evolution-state-json
  name: '@deepseek-ai/dsh-evolution-state-json'
- id: evolution-state
  name: '@deepseek-ai/dsh-evolution-state'
  # P2-6 (V10-16): explicit provider pin. The storage registry's `provider()`
  # has NO fallback logic — unpinned, the effective provider is whichever row
  # registered first (fragile yml row order). `domain` is the primary medium;
  # the json provider above stays mountable as an explicitly selectable
  # alternative (an overlay re-pins `provider: json`), never an automatic
  # failover. Both provider rows remain listed so the pinned name resolves.
  config:
    provider: domain

# ── memory: registry, provider, model-facing tool ───────────────────────────
- id: memory
  name: '@deepseek-ai/dsh-memory'
- id: memory-files
  name: '@deepseek-ai/dsh-memory-files'
- id: tool-memory
  name: '@deepseek-ai/dsh-tool-memory'

# ── skills: usage telemetry, model-facing management tool ───────────────────
- id: skill-usage
  name: '@deepseek-ai/dsh-skill-usage'
- id: tool-skill-manage
  name: '@deepseek-ai/dsh-tool-skill-manage'
- id: evolution-skill-catalog
  name: '@deepseek-ai/dsh-evolution-skill-catalog'

# ── write admission: staged approval (off by default) + threat guard ────────
- id: evolution-approval
  name: '@deepseek-ai/dsh-evolution-approval'
  config:
    enabled: false
    stageForeground: true
# Retired (0.3.66): `evolution-capability` was removed — approval that does not
# gate execution is only a log, and the dynamic-package lifecycle belongs to the
# platform Creator mode.
- id: evolution-threat
  name: '@deepseek-ai/dsh-evolution-threat'

# ── review / curator / observability / human controls ───────────────────────
- id: evolution-review
  name: '@deepseek-ai/dsh-evolution-review'
  # V5-24 (0.3.32): keep the standalone review row byte-consistent with the
  # overlay/host form — the tool allow-list narrows review subagents to the
  # plain `skill` tool (the DSH catalog exposes it only).
  config:
    reviewToolAllow: [skill]
- id: evolution-curator
  name: '@deepseek-ai/dsh-evolution-curator'
- id: evolution-commands
  name: '@deepseek-ai/dsh-evolution-commands'
- id: evolution-activity
  name: '@deepseek-ai/dsh-evolution-activity'
- id: evolution-feedback
  name: '@deepseek-ai/dsh-evolution-feedback'
- id: evolution-learning-graph
  name: '@deepseek-ai/dsh-evolution-learning-graph'
- id: evolution-replay
  name: '@deepseek-ai/dsh-evolution-replay'
