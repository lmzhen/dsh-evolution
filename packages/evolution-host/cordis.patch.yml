# Host-plane evolution bundle.
#
# This layer owns the shared self-evolution INFRASTRUCTURE: registries,
# providers, control plane, background review/curator, and observability.
# It registers NO memory/skill model tools; `memory`/`skill_manage` are the
# agent-preset layer (see ../evolution-agent/agent.cordis.yml), so a profile
# can run evolution automation without exposing them to every session.
# v20 correction (E-1): the former "NO model-facing tools" claim was false —
# the bundle carries exactly ONE read-only model-visible tool, the
# `maintenance_probe` row below (its only model-facing surface).
- insert:
    # ── runtime services: one projection owner per composition ───────────────
    - id: evolution-platform
      name: '@deepseek-ai/dsh-evolution-platform'
    - id: evolution-core-runtime
      name: '@deepseek-ai/dsh-evolution-core/runtime'

    # ── control plane ───────────────────────────────────────────────────────
    - id: evolution-policy
      name: '@deepseek-ai/dsh-evolution-core/policy'

    # ── IO seam: one registry, one node:fs provider ─────────────────────────
    - id: evolution-io
      name: '@deepseek-ai/dsh-evolution-core/io-registry'
    - id: evolution-io-node
      name: '@deepseek-ai/dsh-evolution-core/io-node'
    - id: evolution-io-platform
      name: '@deepseek-ai/dsh-evolution-core/io-platform'
    - id: evolution-authority
      name: '@deepseek-ai/dsh-evolution-core/authority-plugin'

    # ── durable state: registry + platform storage-domain provider ───────────
    - id: evolution-state-storage
      name: '@deepseek-ai/dsh-evolution-core/state/storage'
    - id: evolution-state-domain
      name: '@deepseek-ai/dsh-evolution-core/state/domain'
      # G8-B2: shipped default. The platform base bundle mounts the storage-domain
      # facility over its json backend, so this provider registers the KV domain
      # without the family owning a second file medium.
    - id: evolution-state-store
      name: '@deepseek-ai/dsh-evolution-core/state/store-plugin'
    - id: evolution-state
      name: '@deepseek-ai/dsh-evolution-core/state'
      # D1b: `auto` selects `store` after /evolution migrate state writes the
      # migration marker, and `domain` otherwise. The old domain data is never
      # deleted, so reverting is removing the marker + restarting.
      config:
        provider: auto

    # ── memory seam: registry and provider, no model tool ───────────────────
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: memory-files
      name: '@deepseek-ai/dsh-memory/files'

    # ── skill telemetry (skill catalog/writer live in agent presets) ────────
    # `sessionScoped: true`: the family observes only the sessions that carry
    # its model tools. The shipped bundles all set it — mounted at profile root
    # that is every session, inside a variant preset only the ones that selected
    # it. See evolution-core/src/opt-in.ts.
    # S0-4 (v43 G-1 / J-1): in the HOST-ONLY form the premise fails — this bundle
    # mounts NO model tool row (tool-memory / tool-skill-manage are
    # devDependencies), so the probe matches no session and BOTH this row and
    # evolution-review below go inert. The row stays enabled: what was missing was
    # the diagnosis, not the gate. It is no longer silent — the gate leaves one
    # warn per process, and `/evolution doctor` prints
    # `scoped rows: evolution-review=on/skill-usage=on, probe=never-hit` with the
    # host-only and variant readings spelled out.
    - id: skill-usage
      name: '@deepseek-ai/dsh-evolution-skill-discovery/usage'
      config:
        sessionScoped: true

    # ── write admission: staged approval (off by default) + threat guard ────
    - id: evolution-approval
      name: '@deepseek-ai/dsh-evolution-approval'
      config:
        enabled: false
        stageForeground: true
    # Retired (0.3.66): `evolution-capability` source was removed — approval that
    # does not gate execution is only a log, and the dynamic-package lifecycle
    # belongs to the platform Creator mode.
    - id: evolution-threat
      name: '@deepseek-ai/dsh-evolution-activity/threat'

    # ── review / curator / observability / human controls ───────────────────
    - id: evolution-review
      name: '@deepseek-ai/dsh-evolution-review'
      config:
        # See the skill-usage row above: an original-preset session under a
        # variant install carries no family tools and must not be injected. The
        # host-only caveat there applies here too — a probe that never matches is
        # reported by the gate's one-time warn and by `/evolution doctor`
        # (S0-4 / v43 G-1), never inferred from a silent skip.
        sessionScoped: true
    - id: evolution-curator
      name: '@deepseek-ai/dsh-evolution-curator'
    - id: evolution-commands
      name: '@deepseek-ai/dsh-evolution-commands'
    - id: evolution-maintenance-tools
      name: '@deepseek-ai/dsh-evolution-maintenance/tools'
    - id: evolution-activity
      name: '@deepseek-ai/dsh-evolution-activity'
    - id: evolution-feedback
      name: '@deepseek-ai/dsh-evolution-activity/feedback'
    - id: evolution-learning-graph
      name: '@deepseek-ai/dsh-evolution-activity/learning-graph'
    - id: evolution-replay
      name: '@deepseek-ai/dsh-evolution-activity/replay'

    # ── skill merge: the merged-pair queues and the read-only panel ─────────────
    # Host half mounts four read-only routes under /api/dsh-evolution/merge/*
    # and the /merge command; run engine and staging tool mount from the same row.
    # The browser half is evolution-merge-ui; this row owns the permission/Config row.
    - id: evolution-merge
      name: '@deepseek-ai/dsh-evolution-merge'
