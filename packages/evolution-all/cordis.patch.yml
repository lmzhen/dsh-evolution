# Full-functionality evolution bundle (DEFAULT install target).
#
# This layer = evolution-host's entire infrastructure plane ∪ the three
# agent-preset-class family model tool rows (tool-memory / tool-skill-manage /
# evolution-skill-catalog), all mounted at PROFILE-ROOT
# level: installing
# @lmzhen/dsh-evolution-all is the default "most complete first" path — every
# session gets the automation AND the memory/skill tools AND the
# SKILLS/MEMORY guidance injection, with no agent-preset step.
# (v20 wording: the host plane inside this bundle also carries the read-only
# `maintenance_probe` schema via its evolution-maintenance-tools row — a
# fourth model-visible surface beyond the three rows above.)
#
# THREE-WAY DRIFT GUARD (evolution-host/tests/bundle-mutual-exclusion.spec.ts):
#   - every infra row block below must stay byte-identical to
#     evolution-host/cordis.patch.yml (same id/name/config/disabled);
#   - the three model rows must stay byte-identical to
#     evolution-preset/cordis.patch.yml's model rows;
#   - the row names must all resolve inside this package's dependency closure.
# MUTUAL EXCLUSION: all / host / one-click preset are ALTERNATIVE install
# targets — mounting two of them triple-mounts the infra rows and fails loud
# at startup (invariants: already registered). `all` is likewise exclusive
# with the layered Evolution agent preset (the preset scope's model rows would
# double-mount the tools). Single install only.
- insert:
    # ── runtime services: one projection owner per composition ───────────────
    - id: evolution-adapter
      name: '@deepseek-ai/dsh-evolution-adapter'
    - id: evolution-core-runtime
      name: '@deepseek-ai/dsh-evolution-core/runtime'

    # ── control plane ───────────────────────────────────────────────────────
    - id: evolution-policy
      name: '@deepseek-ai/dsh-evolution-core/policy'

    # ── IO seam: one registry, one node:fs provider ─────────────────────────
    - id: evolution-io
      name: '@deepseek-ai/dsh-evolution-core/io-registry'
    - id: evolution-io-platform
      name: '@deepseek-ai/dsh-evolution-core/io-platform'
    - id: evolution-authority
      name: '@deepseek-ai/dsh-evolution-core/authority-plugin'

    # ── durable state: registry + platform storage-domain provider ───────────
    - id: evolution-state-storage
      name: '@deepseek-ai/dsh-evolution-state/storage'
    - id: evolution-state-domain
      name: '@deepseek-ai/dsh-evolution-state/domain'
      # G8-B2: shipped default. The platform base bundle mounts the storage-domain
      # facility over its json backend, so this provider registers the KV domain
      # without the family owning a second file medium.
    - id: evolution-state
      name: '@deepseek-ai/dsh-evolution-state'
      # S1-D1 (0.3.80) / G8-B2: the medium is PINNED to the platform storage-domain
      # provider — the shipped default since evolution-state-json was retired.
      config:
        provider: domain

    # ── memory seam: registry, provider, model-facing tool ───────────────────
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: memory-files
      name: '@deepseek-ai/dsh-memory/files'
    - id: tool-memory
      name: '@deepseek-ai/dsh-memory/tools'

    # ── skills: usage telemetry, model-facing management tools ───────────────
    # `sessionScoped: true` is shared with evolution-host/preset (byte-identical
    # row); with the model rows at profile root every session carries them.
    - id: skill-usage
      name: '@deepseek-ai/dsh-evolution-skill-discovery/usage'
      config:
        sessionScoped: true
    - id: tool-skill-manage
      name: '@deepseek-ai/dsh-tool-skill-manage'
    # S3-1 (G-3) LAYER SEMANTICS: this row files into the GLOBAL layer (profile
    # root). It governs sessions WITHOUT the Evolution agent preset; with the
    # preset active, the preset layer is NEARER and wins a duplicate name
    # outright — rank does not cross layers (packages/skill/skill/src/index.ts:
    # "the nearest layer's entry wins a duplicate name outright, and the rank
    # order decides duplicates only within one layer"). So `includeSkillNames` /
    # `excludeSkillNames` set HERE have no effect on a preset session: set them on
    # the preset's row (evolution-preset/cordis.yml) for those sessions, and
    # install ONE form (doctor flags all + layered preset as a double-mount).
    # tests/rank-contract.spec.ts pins both halves mechanically.
    - id: evolution-skill-catalog
      name: '@deepseek-ai/dsh-evolution-skill-discovery/catalog'
    - id: evolution-skill-discovery
      name: '@deepseek-ai/dsh-evolution-skill-discovery'
      config:
        mode: off
        featureEpoch: v0

    # ── write admission: staged approval (off by default) + threat guard ────
    - id: evolution-approval
      name: '@deepseek-ai/dsh-evolution-approval'
      config:
        enabled: false
        stageForeground: true
    # Retired (0.3.66): `evolution-capability` source was removed — approval that
    # does not gate execution is only a log, and the dynamic-package lifecycle
    # belongs to the platform Creator mode.
    - id: evolution-threat
      name: '@deepseek-ai/dsh-evolution-activity/threat'

    # ── review / curator / observability / human controls ───────────────────
    - id: evolution-review
      name: '@deepseek-ai/dsh-evolution-review'
      config:
        # Shared with host/preset (byte-identical row); the model rows are at
        # profile root here, so every session carries them.
        sessionScoped: true
    - id: evolution-curator
      name: '@deepseek-ai/dsh-evolution-curator'
    - id: evolution-commands
      name: '@deepseek-ai/dsh-evolution-commands'
    - id: evolution-maintenance-tools
      name: '@deepseek-ai/dsh-evolution-maintenance/tools'
    - id: evolution-activity
      name: '@deepseek-ai/dsh-evolution-activity'
    - id: evolution-feedback
      name: '@deepseek-ai/dsh-evolution-activity/feedback'
    - id: evolution-learning-graph
      name: '@deepseek-ai/dsh-evolution-activity/learning-graph'
    - id: evolution-replay
      name: '@deepseek-ai/dsh-evolution-activity/replay'

    # ── skill health: the sidebar panel over the linter's findings ───────────
    # Host half mounts ONE read-only route under /api/dsh-evolution/skill-health/rows
    # (the panel's only data path; it writes nothing). The browser half is the
    # left-sidebar panel row that reads it, grouped by rule. This row SHIPS DISABLED
    # on purpose: a rule whose threshold is not calibrated yet must not reach a reader
    # as a number, so the panel stays off until an operator opts in.
    - id: evolution-skill-health
      name: '@deepseek-ai/dsh-evolution-skill-health'
      disabled: true

    # ── web UI: settings cards + skill history ───────────────────────────────
    # Web UI umbrella: this row mounts the settings cards and skill-history panels.
    # The merge panel is the separate client-only evolution-merge-ui package; health stays its own disabled row.
    - id: evolution-ui
      name: '@deepseek-ai/dsh-evolution-ui'

    # ── skill merge: the merged-pair queues and the read-only panel ─────────────
    # Host half mounts four read-only routes under /api/dsh-evolution/merge/*
    # and the /merge command; run engine and staging tool mount from the same row.
    # The browser half is evolution-merge-ui; this row owns the permission/Config row.
    - id: evolution-merge
      name: '@deepseek-ai/dsh-evolution-merge'

    # ── web UI: the merge view inside the workbench ────────────────────────────
    # Client-only merge view: a valid host half (apply/no-op) keeps the package
    # visible to the client-modules scan; the view registers into evolution.workbench.view.
    - id: evolution-merge-ui
      name: '@deepseek-ai/dsh-evolution-merge-ui'
