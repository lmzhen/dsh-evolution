name: evolution-validate
description: >-
  Validate the evolution family against one upstream ref: overlay the flat
  mirror packages into the upstream tree, install, build/test/lint, pack the
  scoped release and run the publish dry-run. Shared by the baseline validate
  job and the released-upstream compat check (they differ only in the anchor
  ref and whether the baseline's tsconfig.host.json project graph is copied).
inputs:
  upstream_repo:
    description: Upstream repository to overlay onto
    required: true
  upstream_ref:
    description: Upstream commit or tag to validate against
    required: true
  platform_version:
    description: >-
      PLATFORM_VERSION the family targets (npm version of the released
      upstream, e.g. 0.1.1-rc.2). ONE definition point: the pack step rewrites
      every @deepseek-ai/dsh-* range to ^<this> and the N-2 guard asserts the
      staged manifests actually carry it (N-2). The compat job calls it with
      the same version as its upstream_ref (`dsh-v<platform_version>`).
    required: true
  artifact_suffix:
    description: Suffix for the uploaded artifacts (baseline / released)
    required: false
    default: baseline
  copy_host_tsconfig:
    description: >-
      'true' overlays tsconfig.host.json (the UPSTREAM_SHA-specific project
      graph used by the baseline job); 'false' leaves the target tree's own
      root configs untouched (required for a different upstream ref — the
      host project graph is commit-bound and must never cross trees).
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.upstream_repo }}
        ref: ${{ inputs.upstream_ref }}
        path: upstream
        persist-credentials: false

    - name: Overlay mirror packages into upstream
      shell: bash
      run: |
        mkdir -p upstream/packages/evolution
        if [ "${{ inputs.copy_host_tsconfig }}" = "true" ]; then
          # Baseline job: the mirror owns the root configs — it overlays the
          # pinned dev tree (UPSTREAM_SHA checkout) with OUR base/host files
          # (the baseline tree has no evolution alias paths otherwise).
          cp tsconfig.base.json upstream/tsconfig.base.json
          cp tsconfig.host.json upstream/tsconfig.host.json
        else
          # Released-upstream compat job (N-7 purity): the target tree is a
          # REAL released dsh commit; its own root configs must stay untouched
          # so the chain validates the tree as shipped. Only the evolution
          # alias paths are injected (single source: the mirror base's
          # evolution lines), and the script fails loudly if the released tree
          # already declares one of those keys.
          node packages/scripts/inject-evolution-paths.mjs \
            upstream/tsconfig.base.json \
            tsconfig.base.json
        fi
        cp -r packages/. upstream/packages/evolution/
        rm -rf upstream/packages/evolution/node_modules \
               upstream/packages/evolution/lib \
               upstream/packages/evolution/dist

    - uses: pnpm/action-setup@v4
      with:
        version: '11.7.0'

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: upstream/pnpm-lock.yaml

    - name: Install immutable dependencies
      shell: bash
      working-directory: upstream
      run: pnpm install --no-frozen-lockfile

    - name: Build, test and lint
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/build-lib.mjs
        node node_modules/vitest/vitest.mjs run packages/evolution
        node node_modules/oxlint/bin/oxlint packages/evolution

    - name: Pack scoped release
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/prepare-release.mjs \
          --scope "$NPM_SCOPE" \
          --version "${RELEASE_VERSION#v}" \
          --platform-version "${{ inputs.platform_version }}"

    - name: Verify platform version ranges (N-2 guard)
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/verify-platform-ranges.mjs \
          --platform-version "${{ inputs.platform_version }}" \
          --manifest-dir packages/evolution/dist

    - name: Publish dry-run
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/publish-scoped.mjs \
          --no-provenance \
          --dry-run

    - uses: actions/upload-artifact@v4
      with:
        name: evolution-dist-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/dist
        retention-days: 14

    - uses: actions/upload-artifact@v4
      with:
        name: evolution-scripts-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/scripts
        retention-days: 14
