name: evolution-validate
description: >-
  Validate the evolution family against one upstream ref: overlay the flat
  mirror packages into the upstream tree, install, build/test/lint, pack the
  scoped release and run the publish dry-run. Shared by the baseline validate
  job and the released-upstream compat check (they differ only in the anchor
  ref and whether the baseline's tsconfig.host.json project graph is copied).
inputs:
  upstream_repo:
    description: Upstream repository to overlay onto
    required: true
  upstream_ref:
    description: Upstream commit or tag to validate against
    required: true
  platform_version:
    description: >-
      PLATFORM_VERSION the family targets (npm version of the released
      upstream, e.g. 0.1.1-rc.2). ONE definition point: the pack step rewrites
      every @deepseek-ai/dsh-* range to ^<this> and the N-2 guard asserts the
      staged manifests actually carry it (N-2). The compat job calls it with
      the same version as its upstream_ref (`dsh-v<platform_version>`).
    required: true
  platform_floor:
    description: >-
      PLATFORM_FLOOR the published peer ranges declare (the earliest rc of the
      validated line, e.g. ^0.2.0-rc.1 while platform_version is 0.2.0-rc.2).
      Empty means the same as platform_version (single-line releases that ship
      one rc). The floor is what prepare-release writes into every
      @deepseek-ai/dsh-* range and what the range guard asserts (G7 §2.1).
    required: false
    default: ''
  install_smoke:
    description: >-
      'true' additionally installs the packed family into a throwaway
      DSH_HOME with the family's own installer and lets the profile guard
      judge the result. The desktop job sets it: the Electron cold-boot
      assertion needs the signed app (a real-machine step), while the WINDOWS
      half of the install path is exactly what CI can own.
    required: false
    default: 'false'
  artifact_suffix:
    description: Suffix for the uploaded artifacts (baseline / released)
    required: false
    default: baseline

  npm_scope:
    description: >-
      npm scope the pack rewrite and the platform-range guard use. R-10: ONE
      source with the release workflow's NPM_SCOPE env — the workflow passes
      its env value here explicitly, and this action feeds it to BOTH the pack
      rewrite (--scope) and the range guard (--our-scope) so the family
      exemption prefix can never drift from the publish scope.
    required: false
    default: '@lmzhen'
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.upstream_repo }}
        ref: ${{ inputs.upstream_ref }}
        path: upstream
        persist-credentials: false

    - name: Overlay mirror packages into upstream
      shell: bash
      run: |
        mkdir -p upstream/packages/evolution
        # N-7 purity: the target tree is a REAL released dsh commit; its own root
        # configs stay untouched so the chain validates the tree as shipped. Only the
        # evolution alias paths are injected (single source: the mirror base's evolution
        # lines), and the script fails loudly if the released tree already declares one.
        #
        # G7 (0.17.0): the baseline job that used to overlay the mirror's own
        # `tsconfig.host.json` (the UPSTREAM_SHA project graph) is retired with the
        # 0.1.5 line, so this is the only overlay form left. Test-file typechecking
        # now lives in the family's own gate (`tsc -b tsconfig.host.json` on the build
        # line, where that graph does include `packages/evolution/**`).
        node packages/scripts/inject-evolution-paths.mjs \
          upstream/tsconfig.base.json \
          tsconfig.base.json
        cp -r packages/. upstream/packages/evolution/
        rm -rf upstream/packages/evolution/node_modules \
               upstream/packages/evolution/lib \
               upstream/packages/evolution/dist
        # P2-41 (v11): local overlay residue (mirror staging swap variants)
        # would be copied into the upstream tree and double-counted by the
        # guards below — remove them with the same hygiene as node_modules/lib.
        rm -rf upstream/packages/evolution/.release-staging.next \
               upstream/packages/evolution/.release-staging.previous

    - name: Verify layout sync and version alignment (P2-15, V9-01 guard)
      shell: bash
      working-directory: upstream
      run: |
        # P2-37 (v11): the SCRIPTS half of this check is tautological directly
        # after the overlay copy (the overlay COPIED those files) — the real
        # dev↔mirror scripts sync invariant can only be verified where the dev
        # tree exists (the release-time publish-chain runs it before commit).
        # The VERSION half is genuine and stays: the mirror CHANGELOG head must
        # equal the root manifest and every package manifest version — the
        # V9-01 incident rewrote 30 manifests and nothing caught it. The second
        # argument anchors the version guard at the MIRROR checkout root.
        node packages/evolution/scripts/verify-layout-sync.mjs \
          packages/evolution/scripts ../packages/scripts

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: '11.7.0'

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: upstream/pnpm-lock.yaml

    - name: Pre-register overlay workspace packages in the lockfile (P2-16)
      shell: bash
      working-directory: upstream
      run: |
        # The committed upstream lockfile predates the overlaid
        # packages/evolution/* workspace members (the upstream globs match
        # packages/*/*), so a plain install had to run --no-frozen-lockfile and
        # re-resolve on every run — the same tag could produce different
        # dependency graphs and the validate "green" was not reproducible.
        # Resolve ONCE here (--lockfile-only: lockfile update, no node_modules),
        # recording the resolution in this step's log, then install from the
        # now-complete lockfile under --frozen-lockfile below.
        pnpm install --lockfile-only --no-frozen-lockfile
        echo "pre-registered $(grep -c '^  packages/evolution/' pnpm-lock.yaml || true) evolution importer(s) into the lockfile"

    - name: Install dependencies from the frozen lockfile
      shell: bash
      working-directory: upstream
      run: pnpm install --frozen-lockfile

    - name: Build the host native addon (POSIX flock binding)
      shell: bash
      working-directory: upstream
      run: |
        # The platform's JSONL session persistence locks its log through
        # @deepseek-ai/node-addon-system's flock binding. A source checkout ships
        # no prebuilt binding and the package has NO install-time compile
        # fallback (native/system/AGENTS.md: "missing flock bindings reject
        # acquisition"), so any test that opens a real persistence handle dies
        # with MODULE_NOT_FOUND .../bin/glibc/system.node on the runner.
        # Upstream's own repository tests build exactly this host addon through
        # the root script, so the overlay does the same before running them.
        pnpm run build:native-system

    - name: Build, test and lint
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/build-lib.mjs
        # Worker cap + explicit timeout: the suite has IO-heavy lock/CAS cases
        # (write-lock takeover, cross-process RMW, dir-fsync) that are sensitive
        # to machine load. At vitest's defaults (full parallelism, 5s testTimeout)
        # a loaded runner produced a false red on 2026-09-13 — the two
        # REV-06(b) lock cases (anchored-smoke TEST-06/TEST-07) lost their write
        # to a takeover and failed; the identical commit passed on the sibling
        # job and on an immediate rerun. This is the same configuration the
        # release-time local gate uses (and has been green 10/10 repeatedly):
        # maxWorkers=2, testTimeout=30s.
        node node_modules/vitest/vitest.mjs run packages/evolution --maxWorkers=2 --testTimeout=30000
        node node_modules/oxlint/bin/oxlint packages/evolution

    # G7 (0.17.0): the D-9 test-file typecheck step is GONE with the baseline job — it ran the
    # MIRROR's `tsconfig.host.json` against the pinned dev tree, and that graph is not ours to
    # run on a released tree. The guard itself still runs: the family's own gate does
    # `tsc -b tsconfig.host.json` on the build line, where the project includes
    # `packages/evolution/**` (tests included).
    - name: Run the load-sensitive lock group at a pinned concurrency (G7.2)
      shell: bash
      working-directory: upstream
      run: |
        # G7.2: the lock-timing/liveness cases are run ONCE at a pinned worker
        # count (default 4, DSH_EVOLUTION_LOAD_SENSITIVE_WORKERS overrides), with
        # retries off — a green default-parallel run says less than a green run at
        # a known concurrency, and the runner also fails when a renamed case
        # drops out of the group (no vacuous pass).
        node packages/evolution/scripts/run-load-sensitive.mjs .

    - name: Verify dependency closure (G0.1 guard)
      shell: bash
      working-directory: upstream
      run: |
        # 0.3.26 (V4-03): F-105's guard was only run locally — wire it into the
        # chain before packing so a new undeclared cross-package import fails CI.
        node packages/evolution/scripts/verify-dependency-closure.mjs packages/evolution

    - name: Pack scoped release
      shell: bash
      working-directory: upstream
      env:
        PLATFORM_VERSION: ${{ inputs.platform_version }}
        PLATFORM_FLOOR: ${{ inputs.platform_floor }}
        NPM_SCOPE: ${{ inputs.npm_scope }}
      run: |
        # A tag packs its own semver; a main push packs the dev placeholder
        # `RELEASE_VERSION`, which deliberately does not match the manifests —
        # `--dev-build` declares that (v21 S-4 reconciliation is skipped there,
        # and that staging is never published: the publish job is tag-gated).
        ARGS=(--scope "$NPM_SCOPE" --version "${RELEASE_VERSION#v}" --platform-version "$PLATFORM_VERSION")
        # G7 §2.1: the FLOOR is a separate input — it is what the published ranges declare, so
        # omitting it would publish ^<tested-line> and refuse the line's earlier rc.
        if [[ -n "$PLATFORM_FLOOR" ]]; then ARGS+=(--platform-floor "$PLATFORM_FLOOR"); fi
        if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then ARGS+=(--dev-build); fi
        node packages/evolution/scripts/prepare-release.mjs "${ARGS[@]}"

    - name: Audit the packed tarballs (what a user installs)
      shell: bash
      working-directory: upstream
      env:
        PLATFORM_FLOOR: ${{ inputs.platform_floor }}
        PLATFORM_VERSION: ${{ inputs.platform_version }}
      run: |
        # The pack step proves pnpm can produce tarballs and the range guard reads their
        # MANIFESTS; neither one opens a tarball. This reads the payloads: every entry file a
        # consumer resolves exists, the scoped release dropped its ./src/* shim, the platform
        # ranges are exactly the floor, no @deepseek-ai/dsh-evolution- literal survived the
        # rescope, each browser half carries lib/client.js plus dsh.client, and no test /
        # node_modules / tarball residue rode along.
        RANGE="${PLATFORM_FLOOR:-$PLATFORM_VERSION}"
        node packages/evolution/scripts/audit-release-tarballs.mjs \
          packages/evolution/dist --version "${RELEASE_VERSION#v}" --platform-range "^$RANGE"

    - name: Verify platform version ranges (N-2 guard)
      shell: bash
      working-directory: upstream
      env:
        PLATFORM_VERSION: ${{ inputs.platform_version }}
        PLATFORM_FLOOR: ${{ inputs.platform_floor }}
        NPM_SCOPE: ${{ inputs.npm_scope }}
      run: |
        # R-10: --our-scope is passed EXPLICITLY from the same scope the pack
        # rewrite used — the guard's '@lmzhen' default is no longer an
        # independent second definition that can silently drift.
        # G7 §2.1: the guard asserts the FLOOR (what the ranges must admit), not the tested
        # line — passing the tested line here was how a range could exclude its own line's rc.
        RANGE_FLOOR="${PLATFORM_FLOOR:-$PLATFORM_VERSION}"
        node packages/evolution/scripts/verify-platform-ranges.mjs \
          --platform-version "$RANGE_FLOOR" \
          --manifest-dir packages/evolution/.release-staging \
          --our-scope "$NPM_SCOPE"

    - name: Verify architecture guards (G7.1)
      shell: bash
      working-directory: upstream
      run: |
        # 0.3.23: strict mode is on — N1/N2 are zero-tolerance (single-source
        # contracts); 0.3.25 flipped N3 into the gate too (numeric clamps);
        # P3-2 (v14): the warn-only N4 "dead-fallback" listing was removed
        # (78/78 false positives), so the gate is N1/N2/N3 + H2 ghost keys.
        node packages/evolution/scripts/verify-arch-guards.mjs packages/evolution --strict

    - name: Verify event pairing (G7.3)
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/verify-event-pairing.mjs packages/evolution --strict

    - name: Verify declared config reach (G3.1)
      shell: bash
      working-directory: upstream
      run: |
        # G3.1 (v27 T-1): a patch layer only overrides keys of a row that exists
        # AND is enabled in the plane below it. The platform's web-app bundle
        # disables the profile-root `tool-skill` row (presets own the per-agent
        # skill rows), so the declared `catalogDescriptionMaxLength: 60` is
        # reachable in that profile only through the preset composer — the guard
        # prints each declaration's reach per profile and fails (strict) when a
        # declared key has no plane that reads it, or when a claimed composer
        # reach no longer exists in the code it names.
        # WARN mode for one release (batch-3 rule: one warn round before strict).
        # V27 batch-3 close-out: the warn round is over — the gate reports 0
        # violations on this tree, so CI now runs it strict (the plan's §5 flip).
        node packages/evolution/scripts/verify-declared-config.mjs packages/evolution --strict

    - name: Verify the platform contract against the checked-out upstream ref (v33 G4.1/G4.2)
      if: inputs.copy_host_tsconfig == 'false'
      shell: bash
      working-directory: upstream
      run: |
        # v33 G4.1/G4.2: the two probes that turn hand-copied platform facts into
        # a red light. They run ONLY in this job: the baseline job's tree is the
        # dev anchor (UPSTREAM_SHA), not the platform line the family targets, so
        # its plane classification, Config keys and anchor text are EXPECTED to
        # differ and the probes would report exactly that as drift.
        #
        # verify-declared-config --upstream: recomputes each plane's disabled set
        # and each overridden row's Config key set from the platform's own
        # sources instead of trusting the snapshot in the guard, and checks that
        # every platform key is acknowledged in the bundle patches'
        # whole-config-replacement note (an override replaces `config` wholesale).
        #
        # verify-platform-contract runs in its DEFAULT (strict) mode: v33 G0
        # re-recorded every anchor to this platform line, so any difference now
        # fails again — a platform symbol the family imports that is gone, a
        # service name nobody provides, a re-scaled section order, or a recorded
        # anchor whose text moved. The NEXT upgrade starts by running the same
        # script with --accept-recorded to turn this red light into a decision
        # list, then re-records the anchors and drops the flag once more.
        node packages/evolution/scripts/verify-declared-config.mjs \
          packages/evolution --strict --upstream .
        node packages/evolution/scripts/verify-platform-contract.mjs \
          packages/evolution --upstream .

    - name: Verify the family guard set (G5/G6)
      shell: bash
      working-directory: upstream
      run: |
        # The guards the family's own gate runs on the build line and this action did not. Each is
        # line-independent (it reads the overlay tree), and each covers a silent-failure class: a
        # parameter channel that drifted from the registry, a browser seat nobody mounts, a bundle
        # row nobody declares, a doc fact that moved. `--upstream .` is the checked-out platform.
        node packages/evolution/scripts/verify-param-registry.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-bundle-rows.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-param-channel-parity.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-client-tokens.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-client-seats.mjs packages/evolution --strict --upstream .
        node packages/evolution/scripts/verify-profile-bundles.mjs --self-test
        # No --require-repo-docs here: the overlay carries `packages/` only, so the repo-level
        # docs (CHANGELOG / README / INSTALL) are not in this tree. That half of the guard runs
        # in the family's own gate against the mirror, where those files exist.
        node packages/evolution/scripts/verify-doc-facts.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-package-discovery.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-family-tool-names.mjs packages/evolution --strict
        node packages/evolution/scripts/verify-skill-roots.mjs packages/evolution --strict
        # The release wiring itself: every artifact `publish` downloads must be produced by a job
        # in the same workflow (v0.17.0-rc.1 spent a human approval, then failed on `-baseline`,
        # whose producing job had been retired). Walks up from the working directory for `.github`.
        node packages/evolution/scripts/verify-release-artifacts.mjs ../.github --strict --self-test

    - name: Install smoke into a throwaway DSH_HOME (desktop plane)
      if: inputs.install_smoke == 'true'
      shell: bash
      working-directory: upstream
      env:
        NPM_SCOPE: ${{ inputs.npm_scope }}
      run: |
        # G7 §2.3: the Windows half of the install path. The Electron cold-boot assertion needs
        # the signed app and stays a real-machine step (recorded in the G2/G3 design docs); what a
        # runner CAN own is that the installer produces a profile its own guard accepts on Windows
        # paths — bundle row, preset row, journal, and no double mount.
        HOME_DIR="$(mktemp -d)"
        node packages/evolution/scripts/install-layered.mjs \
          --home "$HOME_DIR" --profile web --mode layered
        node packages/evolution/scripts/verify-profile-bundles.mjs "$HOME_DIR/profiles/web"
        test -f "$HOME_DIR/profiles/web/.evolution-install.json"
        test -f "$HOME_DIR/profiles/web/cordis.patch.yml"

    - name: Publish dry-run
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/publish-scoped.mjs \
          --no-provenance \
          --dry-run

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: evolution-dist-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/dist
        retention-days: 14

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: evolution-scripts-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/scripts
        retention-days: 14
