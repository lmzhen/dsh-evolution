name: evolution-validate
description: >-
  Validate the evolution family against one upstream ref: overlay the flat
  mirror packages into the upstream tree, install, build/test/lint, pack the
  scoped release and run the publish dry-run. Shared by the baseline validate
  job and the released-upstream compat check (they differ only in the anchor
  ref and whether the baseline's tsconfig.host.json project graph is copied).
inputs:
  upstream_repo:
    description: Upstream repository to overlay onto
    required: true
  upstream_ref:
    description: Upstream commit or tag to validate against
    required: true
  platform_version:
    description: Platform package version used to assemble the full packed-import consumer.
    required: false
    default: '0.2.2-rc.1'
  install_smoke:
    description: >-
      'true' additionally installs the PACKED dist tarballs into a throwaway
      consumer node_modules, imports every package's declared entry and checks
      its bundle patch asset. This is the bytes a user actually receives; the
      source-overlay installer smoke was a different claim. The desktop job
      sets it; the Electron cold-boot assertion still needs the signed app (a
      real-machine step).
    required: false
    default: 'false'
  artifact_suffix:
    description: Suffix for the uploaded artifacts (baseline / released)
    required: false
    default: baseline
  node_version:
    description: Node major version for the build/test gate.
    required: false
    default: '24'
  upload_artifacts:
    description: Upload the packed dist/scripts artifacts for publish.
    required: false
    default: 'true'

  npm_scope:
    description: >-
      npm scope the pack rewrite and the platform-range guard use. R-10: ONE
      source with the release workflow's NPM_SCOPE env — the workflow passes
      its env value here explicitly, and this action feeds it to BOTH the pack
      rewrite (--scope) and the range guard (--our-scope) so the family
      exemption prefix can never drift from the publish scope.
    required: false
    default: '@lmzhen'
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.upstream_repo }}
        ref: ${{ inputs.upstream_ref }}
        path: upstream
        persist-credentials: false

    - name: Overlay mirror packages into upstream
      shell: bash
      run: |
        mkdir -p upstream/packages/evolution
        # N-7 purity: the target tree is a REAL released dsh commit; its own root
        # configs stay untouched so the chain validates the tree as shipped. Only the
        # evolution alias paths are injected (single source: the mirror base's evolution
        # lines), and the script fails loudly if the released tree already declares one.
        #
        # G7 (0.17.0): the baseline job that used to overlay the mirror's own
        # `tsconfig.host.json` (the UPSTREAM_SHA project graph) is retired with the
        # 0.1.5 line, so this is the only overlay form left. Test-file typechecking
        # now lives in the family's own gate (`tsc -b tsconfig.host.json` on the build
        # line, where that graph does include `packages/evolution/**`).
        cp -r packages/. upstream/packages/evolution/
        node packages/scripts/inject-evolution-paths.mjs \
          upstream/tsconfig.base.json \
          tsconfig.base.json
        # G1-S7: the ONE platform line travels with the overlay (prepare-release / range guard read it
        # from the overlay root; no workflow env carries version/floor).
        cp platform-line.json upstream/platform-line.json
        rm -rf upstream/packages/evolution/node_modules \
               upstream/packages/evolution/lib \
               upstream/packages/evolution/dist
        # P2-41 (v11): local overlay residue (mirror staging swap variants)
        # would be copied into the upstream tree and double-counted by the
        # guards below — remove them with the same hygiene as node_modules/lib.
        rm -rf upstream/packages/evolution/.release-staging.next \
               upstream/packages/evolution/.release-staging.previous

    - name: Verify layout sync and version alignment (P2-15, V9-01 guard)
      shell: bash
      working-directory: upstream
      run: |
        # P2-37 (v11): the SCRIPTS half of this check is tautological directly
        # after the overlay copy (the overlay COPIED those files) — the real
        # dev↔mirror scripts sync invariant can only be verified where the dev
        # tree exists (the release-time publish-chain runs it before commit).
        # The VERSION half is genuine and stays: the mirror CHANGELOG head must
        # equal the root manifest and every package manifest version — the
        # V9-01 incident rewrote 30 manifests and nothing caught it. The second
        # argument anchors the version guard at the MIRROR checkout root.
        node packages/evolution/scripts/verify-layout-sync.mjs \
          packages/evolution/scripts ../packages/scripts

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: '11.7.0'

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: pnpm
        cache-dependency-path: upstream/pnpm-lock.yaml

    - name: Pre-register overlay workspace packages in the lockfile (P2-16)
      shell: bash
      working-directory: upstream
      run: |
        # The committed upstream lockfile predates the overlaid
        # packages/evolution/* workspace members (the upstream globs match
        # packages/*/*), so a plain install had to run --no-frozen-lockfile and
        # re-resolve on every run — the same tag could produce different
        # dependency graphs and the validate "green" was not reproducible.
        # Resolve ONCE here (--lockfile-only: lockfile update, no node_modules),
        # recording the resolution in this step's log, then install from the
        # now-complete lockfile under --frozen-lockfile below.
        pnpm install --lockfile-only --no-frozen-lockfile
        echo "pre-registered $(grep -c '^  packages/evolution/' pnpm-lock.yaml || true) evolution importer(s) into the lockfile"

    - name: Install dependencies from the frozen lockfile
      shell: bash
      working-directory: upstream
      run: pnpm install --frozen-lockfile

    - name: Build the host native addon (POSIX flock binding)
      shell: bash
      working-directory: upstream
      run: |
        # The platform's JSONL session persistence locks its log through
        # @deepseek-ai/node-addon-system's flock binding. A source checkout ships
        # no prebuilt binding and the package has NO install-time compile
        # fallback (native/system/AGENTS.md: "missing flock bindings reject
        # acquisition"), so any test that opens a real persistence handle dies
        # with MODULE_NOT_FOUND .../bin/glibc/system.node on the runner.
        # Upstream's own repository tests build exactly this host addon through
        # the root script, so the overlay does the same before running them.
        pnpm run build:native-system

    - name: Build the family libraries
      shell: bash
      working-directory: upstream
      run: node packages/evolution/scripts/build-lib.mjs

    - name: Run the family unit lane (suite; writes the probe baseline)
      shell: bash
      working-directory: upstream
      run: |
        # W10 M3b2: the suite is one registry row again (gates/unit.mjs, gate-03). Its CI override
        # carries the worker cap, the explicit timeout and the JSON reporter the probe lane consumes
        # (W10 M2); no second command list lives here.
        node packages/evolution/scripts/run-gates.mjs ci --lane ci-unit --concurrency 1 --json-out "$RUNNER_TEMP/gates-unit.json"

    # G7 (0.17.0): the D-9 test-file typecheck step is GONE with the baseline job — it ran the
    # MIRROR's `tsconfig.host.json` against the pinned dev tree, and that graph is not ours to
    # run on a released tree. The guard itself still runs: the family's own gate does
    # `tsc -b tsconfig.host.json` on the build line, where the project includes
    # `packages/evolution/**` (tests included).
    - name: Run the load-sensitive lock group at a pinned concurrency (G7.2)
      shell: bash
      working-directory: upstream
      run: |
        # G7.2: the lock-timing/liveness cases are run ONCE at a pinned worker
        # count (default 4, DSH_EVOLUTION_LOAD_SENSITIVE_WORKERS overrides), with
        # retries off — a green default-parallel run says less than a green run at
        # a known concurrency, and the runner also fails when a renamed case
        # drops out of the group (no vacuous pass).
        node packages/evolution/scripts/run-load-sensitive.mjs .
    # Why the line-manifest freshness gate is NOT here (tried on 2026-10-15, removed the same day):
    # the bed manifest is generated from the MIRROR and ships from there; this job checks out the
    # platform repo and copies only packages/evolution/**, so the committed artifact never reaches this
    # tree. Both halves broke on contact for structural reasons, not for want of a path fix: the
    # generator derives its ROOT from its own location (mirror: repo root; here: packages/), so it
    # scanned packages/packages and died with MODULE_NOT_FOUND; and `git status --porcelain` saw the
    # regenerated file as untracked because the committed copy is elsewhere. A check that needs "the
    # artifact is in this tree" belongs to the layout that has it: the three-part sequence (generate ->
    # porcelain proves the committed copy matches -> --check) runs in the mirror local/pre-tag gate,
    # which is also what the header contract says: "真比对进 local/pre-tag；CI 保持 policy-only".
    - name: Pack scoped release
      shell: bash
      working-directory: upstream
      env:
        NPM_SCOPE: ${{ inputs.npm_scope }}
      run: |
        # A tag packs its own semver; a main push packs the dev placeholder
        # `RELEASE_VERSION`, which deliberately does not match the manifests —
        # `--dev-build` declares that (v21 S-4 reconciliation is skipped there,
        # and that staging is never published: the publish job is tag-gated).
        ARGS=(--scope "$NPM_SCOPE" --version "${RELEASE_VERSION#v}")
        # G7 §2.1: the FLOOR is a separate input — it is what the published ranges declare, so
        # omitting it would publish ^<tested-line> and refuse the line's earlier rc.
        # G1-S5: platform version/floor are read from platform-line.json, not passed as flags.
        if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then ARGS+=(--dev-build); fi
        node packages/evolution/scripts/prepare-release.mjs "${ARGS[@]}"

    - name: Audit the packed tarballs (what a user installs)
      shell: bash
      working-directory: upstream
      run: |
        # The pack step proves pnpm can produce tarballs and the range guard reads their
        # MANIFESTS; neither one opens a tarball. This reads the payloads: every entry file a
        # consumer resolves exists, the scoped release dropped its ./src/* shim, the platform
        # ranges are exactly the floor, no @deepseek-ai/dsh-evolution- literal survived the
        # rescope, each browser half carries lib/client.js plus dsh.client, and no test /
        # node_modules / tarball residue rode along.
        # G1-S7: the floor comes from the overlay platform-line.json (the same file prepare-release and
        # the range guard read) — not from an action input that could drift.
        RANGE="$(node -p "require('./platform-line.json').floor")"
        node packages/evolution/scripts/audit-release-tarballs.mjs \
          packages/evolution/dist --version "${RELEASE_VERSION#v}" --platform-range "^$RANGE"

    - name: Run the static gate lane (registry ci-static)
      shell: bash
      working-directory: upstream
      run: |
        # W10 M3b2: every read-only guard below used to be a hand-written step; the lane IS the
        # registry's ci-static set (gates/*.mjs; CI overrides carry the runner-shaped argv). The
        # per-row verdicts land in gates-static.json so a red names its row without reading the log.
        node packages/evolution/scripts/run-gates.mjs ci --lane ci-static --concurrency 2 --json-out "$RUNNER_TEMP/gates-static.json"

    - name: "Run the release gate lane (post-pack: ranges, registry, mutation coverage)"
      shell: bash
      working-directory: upstream
      env:
        NPM_SCOPE: ${{ inputs.npm_scope }}
      run: |
        # W11 A3: release rows run only after pack. gate-27 judges the packed .release-staging tree,
        # gate-48 the seven-axis registry ledger, gate-49 the mutation coverage (registered cannot).
        node packages/evolution/scripts/run-gates.mjs ci --lane ci-release --concurrency 1 --json-out "$RUNNER_TEMP/gates-release.json"

    - name: Declare the line this CI run measured (G1.5)
      shell: bash
      working-directory: upstream
      run: |
        # A setup step, not a gate (lane ci-setup): every conclusion names its line.
        node packages/evolution/scripts/lib-line-header.mjs --ci --policy packages/evolution/scripts/line-policy.json

    - name: Prove the mutation probes can still go red (W9 S4)
      shell: bash
      working-directory: upstream
      run: |
        # Three-valued by design: a probe whose UNMUTATED baseline is not green in this job proves
        # nothing about its mutation, so it is reported as cannot-decide and counted; a mutation that
        # stays green is a real defect and fails here. This is the half CI never ran, which is why a
        # stale probe signature could only be discovered by hand.
        node packages/evolution/scripts/verify-mutations.mjs --probes --no-stamp --baseline=json:"$RUNNER_TEMP/probe-baseline.json" --json
    - name: Assemble the release evidence planes (W10/W11)
      shell: bash
      working-directory: upstream
      env:
        CI_FACE_REF: ${{ github.workflow_ref || github.ref_name }}
        CI_OS: ${{ runner.os }}
      run: |
        # G8: the pack wrote the schema-2 skeleton; the REHEARSAL readings (S1-S4 spikes, W11
        # traceability) are the snapshot checked in beside the scripts; the gate ledger is the set
        # of manifest rows this compat-check job just executed (the step runs only on success), and
        # the face identity comes from the workflow. `--release` is applied by the publish job.
        # A branch/workflow_dispatch run is a dry run: evidence is a tag-time artifact and the
        # publish job owns --release. Keep the gate real on tags; do not fake a pass on branches.
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          node packages/evolution/scripts/assemble-release-evidence.mjs packages/evolution/dist/release-evidence.json \
            --rehearsal packages/evolution/scripts/release-evidence-rehearsal.json \
            --gates-from-manifest ci \
            --ci-face "$CI_FACE_REF" --os "$CI_OS" \
            --commit "${{ github.sha }}" --tag "${{ github.ref_name }}"
          # G8/W2: the staging release-evidence is schema v2 and agrees with the ONE platform line.
          node packages/evolution/scripts/verify-release-evidence.mjs packages/evolution/dist/release-evidence.json
        else
          echo "release evidence: skipped on non-tag dry run"
        fi

    - name: "Packed install: full import against the npm platform"
      shell: bash
      working-directory: upstream
      env:
        PLATFORM_VERSION: ${{ inputs.platform_version }}
      run: |
        PLATFORM_DIR="$(node packages/evolution/scripts/prepare-packed-platform.mjs packages/evolution/dist "$PLATFORM_VERSION" | tail -n 1)"
        test -d "$PLATFORM_DIR"
        node packages/evolution/scripts/smoke-packed-install.mjs packages/evolution/dist --platform-node-modules "$PLATFORM_DIR"

    - name: "Install smoke: packed tarballs into a throwaway consumer"
      shell: bash
      working-directory: upstream
      run: |
        # P2-33: install the PACKED family, not the source overlay. Every tarball is unpacked
        # into a consumer node_modules and its export target/bundle patch is checked before
        # publish. --assets-only is deliberate: the CI checkout's platform packages are source
        # only, so a runtime import cannot resolve @deepseek-ai/*; the full import path is
        # exercised on the real host and in the local gate where the platform is built.
        node packages/evolution/scripts/smoke-packed-install.mjs packages/evolution/dist --assets-only

    - name: Source-overlay installer guard (Windows install path)
      if: inputs.install_smoke == 'true'
      shell: bash
      working-directory: upstream
      run: |
        # Kept alongside the packed smoke: this one still proves the Windows
        # installer shape (bundle row, preset row, journal, no double mount).
        # It is NOT the packed-family evidence; see the step above for that.
        HOME_DIR="$(mktemp -d)"
        node packages/evolution/scripts/install-layered.mjs \
          --home "$HOME_DIR" --profile web --mode layered
        node packages/evolution/scripts/verify-profile-bundles.mjs "$HOME_DIR/profiles/web"
        test -f "$HOME_DIR/profiles/web/.evolution-install.json"
        test -f "$HOME_DIR/profiles/web/cordis.patch.yml"

    - name: Publish dry-run
      shell: bash
      working-directory: upstream
      run: |
        node packages/evolution/scripts/publish-scoped.mjs \
          --no-provenance \
          --dry-run

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ inputs.upload_artifacts == 'true' }}
      with:
        name: evolution-dist-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/dist
        retention-days: 14

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ inputs.upload_artifacts == 'true' }}
      with:
        name: evolution-scripts-${{ inputs.artifact_suffix }}
        path: upstream/packages/evolution/scripts
        retention-days: 14

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ inputs.upload_artifacts == 'true' }}
      with:
        name: evolution-gates-${{ inputs.artifact_suffix }}
        path: ${{ runner.temp }}/gates-*.json
        retention-days: 14

    # The name is quoted on purpose: an unquoted colon-space inside a flow scalar makes YAML read
    # this step as a MAPPING, and the runner then refuses the whole action with "Unexpected type".
    - name: 'Verify the gate manifest (G0-5: table union CI <-> reality)'
      shell: bash
      run: |
        # The four-way reconciliation runs in CI too — it used to be local-only while being the
        # executor of the manifest registers (direction 2: a CI-only check nobody registered fails).
        # No `working-directory`: the table lives in the FAMILY checkout, not in the overlaid
        # `upstream/` tree the other steps work in.
        node packages/scripts/verify-gate-manifest.mjs packages
