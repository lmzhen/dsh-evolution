# GitHub secret scanning flags the synthetic provider-shaped values the
# redaction specs must contain: packages/evolution-core/tests/redact.spec.ts
# feeds `AIzaSy…` to the family's own `google api key` pattern
# (packages/evolution-core/src/redact.ts) to prove the redactor masks a real
# key shape. No credential lives in these files, and `tests/` is excluded from
# every published package (packages/scripts/prepare-release.mjs), so scanning
# skips exactly these two specs. Secrets anywhere else are still reported.
paths-ignore:
  - "packages/evolution-core/tests/redact.spec.ts"
  - "packages/evolution-review/tests/redact.spec.ts"
