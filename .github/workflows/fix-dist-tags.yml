# TEMPORARY repair workflow (0.3.18): regain latest for all publish-set
# packages after publish-scoped.mjs defaulted to `next` (missing --tag latest
# in release.yml). Runs on demand only; DELETE after the repair completes.
name: fix-dist-tags

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin latest for every publish-set package
        shell: bash
        run: |
          set -u
          version=0.3.18
          ok=0; failed=0
          for pj in packages/*/package.json; do
            name=$(node -e "console.log(require('./' + process.argv[1]).name)" "$pj") || continue
            case "$name" in
              @deepseek-ai/dsh-evolution-*|@deepseek-ai/dsh-tool-*|@deepseek-ai/dsh-memory*|@deepseek-ai/dsh-skill-usage*)
                scoped="${name/@deepseek-ai/@lmzhen}"
                if npm dist-tag add "$scoped@$version" latest; then ok=$((ok+1)); else failed=$((failed+1)); echo "FAILED: $scoped"; fi
                ;;
            esac
          done
          echo "OK=$ok FAILED=$failed"
          test "$failed" -eq 0
