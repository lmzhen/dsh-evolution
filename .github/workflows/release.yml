name: release

# D-5 (v18): every third-party Action is pinned to a commit SHA with its
# major-version tag as a trailing comment. The publish job holds
# `id-token: write` and the `npm-publish` environment, so a moved upstream tag
# could otherwise mint a publish credential. Bump a pin with
# `gh api repos/<owner>/<repo>/commits/vN --jq .sha`.

on:
  workflow_dispatch:
  pull_request:
    # R-12: docs-only PRs skip the full build (a one-line README edit used to
    # cost two full overlay+test+pack runs). The PUSH trigger intentionally
    # carries NO paths filter — a tag push whose diff happens to touch only
    # docs must never silently skip its own release.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # R-12: the workflow name prefix was redundant — this repo runs exactly one
  # workflow, so the ref alone identifies the group. cancel-in-progress stays
  # false: a running release must never be killed mid-publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_SCOPE: '@lmzhen'
  # G1-S7: the platform line is NOT duplicated here. `platform-line.json` (repository root) is the
  # one home; the `platform-line` job below reads version/floor from it and every downstream job
  # consumes those job outputs. The staged peer/engines ranges are derived by the family scripts
  # from the same file after the overlay copy, so no workflow env can drift from the JSON.
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  # Tags publish as their own semver; non-tag pushes (main) pack with a
  # semver-safe dev placeholder so the publish dry-run can parse the version.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '0.0.0-main' }}

jobs:
  # G1-S7: the ONLY place the workflow reads the platform version/floor. Fields are copied from
  # platform-line.json verbatim (no derivation here); ranges/engines/window derive in the family
  # scripts from the same JSON after the overlay copy.
  platform-line:
    name: platform line
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.line.outputs.version }}
      floor: ${{ steps.line.outputs.floor }}
      upstream_ref: ${{ steps.line.outputs.upstream_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: line
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const line=require('./platform-line.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+line.version+'\nfloor='+line.floor+'\nupstream_ref=dsh-v'+line.version+'\n')"
  # G7 §2.2 (single-line release): the dev-baseline job is GONE. It validated the family against
  # the pinned 0.1.5-era tree (`UPSTREAM_SHA`), which has no `.volatile()` in its vendored
  # schemastery — the run after 0.17.0 failed there with 39 `Property 'volatile' does not exist`
  # errors, which is the floor doing its job rather than a regression. The family supports ONE
  # platform line now, so the job that re-validates the RELEASED line (compat-check below) is the
  # one that must be green, together with the Windows install job.
  # The full chain (build/test/lint + pack + publish dry-run + the family guard set) runs
  # against the RELEASED upstream tag `dsh-v<PLATFORM_VERSION>` — the line the floor admits and
  # the only platform line this family supports. Since 0.17.0 this is the Linux half of the
  # release gate; the Windows half is `desktop-install` below.
  #
  # GATE (rc.54): after consecutive green runs (rc.52 main + rc.53 tag), this
  # job is a hard requirement of `publish` — a released-upstream
  # incompatibility now blocks the release instead of merely failing a run.
  compat-check:
    name: validate (released upstream)
    needs: platform-line
    runs-on: ubuntu-latest
    # R-12: same cap as the baseline validate job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: ${{ needs.platform-line.outputs.upstream_ref }}
          node_version: '24'
          artifact_suffix: released
          npm_scope: ${{ env.NPM_SCOPE }}

  compat-check-node22:
    name: validate (released upstream, node 22)
    needs: platform-line
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: ${{ needs.platform-line.outputs.upstream_ref }}
          node_version: '22'
          artifact_suffix: released-node22
          upload_artifacts: 'false'
          npm_scope: ${{ env.NPM_SCOPE }}

  # G7 §2.3 / W10 M1: the desktop plane. The Electron cold-boot assertion itself stays a
  # real-machine acceptance (it needs the signed app; recorded in the G2/G3 design docs with its
  # evidence). What a runner owns is the WINDOWS half of the INSTALL — the same install guards as
  # before, but the family suite, mutation probes, static guards, tarball audit and publish dry-run
  # stay on the Linux lanes: repeating them here made an "install" job three times the length of
  # the validation it duplicated (W10 §1: 18m57 of which ~30s was install).
  desktop-install:
    name: desktop install (windows)
    needs: platform-line
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/evolution-windows-install
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: ${{ needs.platform-line.outputs.upstream_ref }}
          platform_version: ${{ needs.platform-line.outputs.version }}
          version: ${{ env.RELEASE_VERSION }}
          npm_scope: ${{ env.NPM_SCOPE }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [platform-line, compat-check, compat-check-node22, desktop-install]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # D-10 (v19): the published bytes are the `-released` set built and chain-validated by
      # `compat-check` in THIS run — the same composite action the local gate runs, anchored on
      # the released upstream tag. The v18 wording named a BASELINE set whose producing job was
      # retired with the 0.1.5 line (`9e94073`); `publish` then downloaded a name no job uploads
      # and failed only AFTER the release approval had been spent (v0.17.0-rc.1, 2026-10-09).
      # `verify-release-artifacts.mjs` now pins the wiring: every name downloaded here must be
      # produced in the same workflow. The publish job then re-audits the downloaded bytes
      # (`audit-release-tarballs.mjs`) before they reach npm.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-dist-released
          path: packages/evolution/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-scripts-released
          path: packages/evolution/scripts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install the tarball reader the payload audit extracts with
        shell: bash
        run: |
          # A publish runner carries no node_modules: this job downloads the packed dist and the
          # scripts artifacts only. The audit opens every tarball IN PROCESS (GNU tar on PATH
          # mis-reads a Windows \`D:\...\` path as a remote host), so install the module where the
          # script resolves it — \`packages/evolution/node_modules\` is on that path.
          npm install --prefix packages/evolution --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tar@7

      - name: Re-assemble release evidence with the real CI job ledger
        shell: bash
        env:
          PLATFORM_LINE_RESULT: ${{ needs['platform-line'].result }}
          COMPAT_CHECK_RESULT: ${{ needs['compat-check'].result }}
          COMPAT_CHECK_NODE22_RESULT: ${{ needs['compat-check-node22'].result }}
          DESKTOP_INSTALL_RESULT: ${{ needs['desktop-install'].result }}
        run: |
          # P1-13: the staging ledger assembled in compat-check is synthetic. This
          # jobs-level ledger is the real result of THIS run's required jobs; the
          # per-gate transcript still has to come from a future gate-runner artifact,
          # but these rows are not fabricated ok:true values.
          node - <<'NODE'
          const fs = require('node:fs')
          const rows = [
            ['platform-line', process.env.PLATFORM_LINE_RESULT],
            ['compat-check', process.env.COMPAT_CHECK_RESULT],
            ['compat-check-node22', process.env.COMPAT_CHECK_NODE22_RESULT],
            ['desktop-install', process.env.DESKTOP_INSTALL_RESULT],
          ].map(([id, result]) => ({ id, ok: result === 'success', reading: 'GitHub Actions job ' + id + ' result=' + result, criterionEvaluated: true }))
          fs.writeFileSync('ci-gates.json', JSON.stringify({ gates: rows }, null, 2) + '\n')
          NODE

          node packages/evolution/scripts/assemble-release-evidence.mjs packages/evolution/dist/release-evidence.json \
            --rehearsal packages/evolution/scripts/release-evidence-rehearsal.json \
            --gates-report ci-gates.json \
            --ci-face "$GITHUB_WORKFLOW_REF" --os "$RUNNER_OS" \
            --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --release

      - name: Check the release evidence before publishing
        shell: bash
        run: |
          # W3: the tag run is the only place `--release` applies — every plane must be present and
          # S1-S4 must be PASS (blocked is an environment gap, never a pass). A failure here stops
          # the publish before npm receives a byte.
          node packages/evolution/scripts/verify-release-evidence.mjs packages/evolution/dist/release-evidence.json --release \
            --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"

      - name: Audit the artifacts about to be published
        shell: bash

        run: |
          # Last line of defence on the DOWNLOADED bytes (the released-anchor artifacts this job
          # publishes, not a fresh local pack): the same payload audit the build chain runs,
          # now against the exact tarballs npm is about to receive.
          node packages/evolution/scripts/audit-release-tarballs.mjs \
            packages/evolution/dist --version "${RELEASE_VERSION#v}" --platform-range "^${{ needs.platform-line.outputs.floor }}"

      - name: Publish validated tarballs
        shell: bash
        run: |
          mkdir -p packages/evolution/dist
          # NO explicit --tag (0.3.20, N-4): publish-scoped.mjs now selects the
          # tag by version (prerelease → next, stable → latest) — the explicit
          # hard-coded --tag latest broke prerelease tags and the 0.3.18
          # incident's hardcoded default was the root cause.
          node packages/evolution/scripts/publish-scoped.mjs

  # W10 M4: publishing and verifying are TWO claims. `publish` succeeding means npm accepted the
  # bytes; this job means the registry now serves those same bytes. When npm's propagation window is
  # slow, the old inline step held the publish job for minutes and made a successful publish look
  # red. As its own job it can be re-run alone (`gh run rerun --failed`) without touching publish.
  verify-published:
    name: verify published bytes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-dist-released
          path: packages/evolution/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-scripts-released
          path: packages/evolution/scripts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Compare the registry bytes with the packed bytes
        shell: bash
        run: |
          # Per-package budget with bounded exponential backoff: a propagation window is not a byte
          # difference (exit 2 = cannot decide, never a pass); a real mismatch exits 1.
          node packages/evolution/scripts/verify-published-bytes.mjs \
            packages/evolution/dist --version "${RELEASE_VERSION#v}" \
            --budget-ms 360000 --concurrency 4
