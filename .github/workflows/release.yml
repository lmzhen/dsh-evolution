name: release

# D-5 (v18): every third-party Action is pinned to a commit SHA with its
# major-version tag as a trailing comment. The publish job holds
# `id-token: write` and the `npm-publish` environment, so a moved upstream tag
# could otherwise mint a publish credential. Bump a pin with
# `gh api repos/<owner>/<repo>/commits/vN --jq .sha`.

on:
  pull_request:
    # R-12: docs-only PRs skip the full build (a one-line README edit used to
    # cost two full overlay+test+pack runs). The PUSH trigger intentionally
    # carries NO paths filter — a tag push whose diff happens to touch only
    # docs must never silently skip its own release.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # R-12: the workflow name prefix was redundant — this repo runs exactly one
  # workflow, so the ref alone identifies the group. cancel-in-progress stays
  # false: a running release must never be killed mid-publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_SCOPE: '@lmzhen'
  # ONE platform-version definition (N-2): the compat gate validates against
  # the released upstream tag `dsh-v<PLATFORM_VERSION>` and the publish
  # metadata rewrites every @deepseek-ai/dsh-* range to ^<PLATFORM_VERSION>.
  # Both derive from this single variable, so the declared support range can
  # never drift from the validated anchor again (the rc.54 defect: metadata
  # said ^0.1.0-rc.6 while the compat gate validated 0.1.1-rc.2). The pinned
  # development baseline (UPSTREAM_SHA) stays a validate-only dev anchor and
  # must never feed release metadata.
  PLATFORM_VERSION: 0.1.5-rc.2
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  # Tags publish as their own semver; non-tag pushes (main) pack with a
  # semver-safe dev placeholder so the publish dry-run can parse the version.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '0.0.0-main' }}

jobs:
  validate:
    name: validate (baseline)
    runs-on: ubuntu-latest
    # R-12: a hung full-suite run used to occupy the runner for hours — cap
    # the job (generous headroom over a healthy ~20-30 min run).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned upstream SHA
        id: upstream
        shell: bash
        run: |
          # P3 (v15) anchor semantics: UPSTREAM_SHA is the DEV baseline
          # (validate-only job) and may trail the release tag by many commits;
          # the compat job below pins the RELEASE tree via dsh-v${PLATFORM_VERSION}.
          # A trailing SHA is expected, not an error — do not "fix" it upward
          # without re-running the full dev-tree typecheck against the newer
          # upstream project graph.
          SHA="$(tr -d '[:space:]' < UPSTREAM_SHA)"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: ${{ steps.upstream.outputs.sha }}
          platform_version: ${{ env.PLATFORM_VERSION }}
          artifact_suffix: baseline
          copy_host_tsconfig: 'true'
          # R-10: pass the scope explicitly so the action's pack rewrite and
          # the range guard (--our-scope) share ONE definition with this env.
          npm_scope: ${{ env.NPM_SCOPE }}

  # M4 §4.6: the published platform version (dsh-v0.1.1-rc.2) is a different
  # commit than the pinned development baseline (UPSTREAM_SHA), so this job
  # re-validates the family — same full chain (build/test/lint + pack +
  # publish dry-run) — against the RELEASED upstream tag. The only overlay
  # difference: the baseline's project graph (tsconfig.host.json) is
  # commit-bound and is NOT copied into the released tree.
  #
  # GATE (rc.54): after consecutive green runs (rc.52 main + rc.53 tag), this
  # job is a hard requirement of `publish` — a released-upstream
  # incompatibility now blocks the release instead of merely failing a run.
  compat-check:
    name: validate (released upstream)
    runs-on: ubuntu-latest
    # R-12: same cap as the baseline validate job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: dsh-v${{ env.PLATFORM_VERSION }}
          platform_version: ${{ env.PLATFORM_VERSION }}
          artifact_suffix: released
          copy_host_tsconfig: 'false'
          npm_scope: ${{ env.NPM_SCOPE }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, compat-check]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # D-10 (v18): the published bytes are the BASELINE artifacts validated by
      # the `validate` job — the compat job only proves source compatibility
      # against the released upstream tag and uploads a separate `-released`
      # set. Comparing the two sets' tarball hashes is a deliberate follow-up
      # (the audit's stronger option); until then this comment is the record of
      # the chosen trade-off so the gap is not mistaken for full byte coverage.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-dist-baseline
          path: packages/evolution/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evolution-scripts-baseline
          path: packages/evolution/scripts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish validated tarballs
        shell: bash
        run: |
          mkdir -p packages/evolution/dist
          # NO explicit --tag (0.3.20, N-4): publish-scoped.mjs now selects the
          # tag by version (prerelease → next, stable → latest) — the explicit
          # hard-coded --tag latest broke prerelease tags and the 0.3.18
          # incident's hardcoded default was the root cause.
          node packages/evolution/scripts/publish-scoped.mjs
