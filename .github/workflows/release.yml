name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_SCOPE: '@lmzhen'
  UPSTREAM_VERSION: 0.1.0-rc.6
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  # Tags publish as their own semver; non-tag pushes (main) pack with a
  # semver-safe dev placeholder so the publish dry-run can parse the version.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '0.0.0-main' }}

jobs:
  validate:
    name: validate (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned upstream SHA
        id: upstream
        shell: bash
        run: |
          SHA="$(tr -d '[:space:]' < UPSTREAM_SHA)"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: ${{ steps.upstream.outputs.sha }}
          artifact_suffix: baseline
          copy_host_tsconfig: 'true'

  # M4 §4.6: the published platform version (dsh-v0.1.1-rc.2) is a different
  # commit than the pinned development baseline (UPSTREAM_SHA), so this job
  # re-validates the family — same full chain (build/test/lint + pack +
  # publish dry-run) — against the RELEASED upstream tag. The only overlay
  # difference: the baseline's project graph (tsconfig.host.json) is
  # commit-bound and is NOT copied into the released tree.
  compat-check:
    name: validate (released upstream)
    runs-on: ubuntu-latest
    # Watching mode: a released-upstream failure is visible but never blocks
    # the tag's publish gate. Promote to a hard gate after consecutive green
    # runs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/evolution-validate
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO }}
          upstream_ref: dsh-v0.1.1-rc.2
          artifact_suffix: released
          copy_host_tsconfig: 'false'
          compat_released: 'true'

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evolution-dist-baseline
          path: packages/evolution/dist

      - uses: actions/download-artifact@v4
        with:
          name: evolution-scripts-baseline
          path: packages/evolution/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish validated tarballs
        shell: bash
        run: |
          mkdir -p packages/evolution/dist
          node packages/evolution/scripts/publish-scoped.mjs \
            --tag next
